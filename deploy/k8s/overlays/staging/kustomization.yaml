apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: { kind: ConfigMap, name: dienst-config }
    patch: |-
      - { op: replace, path: /data/WEB_ORIGIN, value: 'https://staging.dienst.example.com' }
  - target: { kind: Ingress, name: dienst }
    patch: |-
      - { op: replace, path: /spec/rules/0/host, value: staging.dienst.example.com }
      - { op: replace, path: /spec/tls/0/hosts/0, value: staging.dienst.example.com }
  - target: { kind: Deployment, name: 'dienst-(api|web)' }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler, name: dienst-api }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }
      - { op: replace, path: /spec/maxReplicas, value: 2 }
