apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
# The deploy workflow sets the image tags (kustomize edit set image); do not hand-edit them here.
patches:
  - target: { kind: Deployment, name: dienst-api }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: 250m }
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 768Mi }
