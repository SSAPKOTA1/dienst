# Run before every rollout; the deploy workflow deletes the previous Job, applies this one and waits for it.
apiVersion: batch/v1
kind: Job
metadata:
  name: dienst-migrate
  labels: { dienst.io/phase: migrate }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: dienst-migrate }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/ssapkota1/dienst-api
          command: ['node', 'apps/api/dist/migrate.mjs']
          envFrom:
            - secretRef: { name: dienst-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
