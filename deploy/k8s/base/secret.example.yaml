# NOT part of the kustomization. Copy, fill in, and apply once: kubectl -n dienst apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: dienst-secrets
  namespace: dienst
type: Opaque
stringData:
  DATABASE_URL: postgres://dienst:CHANGE_ME@db.internal:5432/dienst?sslmode=require
  JWT_SECRET: CHANGE_ME_at_least_32_random_characters
  DATA_KEY: CHANGE_ME_base64_32_bytes
  METRICS_TOKEN: CHANGE_ME
  SMTP_HOST: smtp.example.com
  SMTP_PORT: '587'
