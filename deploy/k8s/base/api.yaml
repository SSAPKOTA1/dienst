apiVersion: apps/v1
kind: Deployment
metadata:
  name: dienst-api
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: dienst-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dienst-api }
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: dienst-api }
      containers:
        - name: api
          image: ghcr.io/ssapkota1/dienst-api
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: dienst-config }
            - secretRef: { name: dienst-secrets }
          env:
            - { name: RUN_JOBS, value: 'false' } # the worker runs the jobs
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 5
          lifecycle:
            preStop: { exec: { command: ['sleep', '5'] } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { medium: Memory, sizeLimit: 64Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: dienst-api
spec:
  selector: { app.kubernetes.io/name: dienst-api }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dienst-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: dienst-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dienst-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: dienst-api }
