apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dienst
labels:
  - pairs: { app.kubernetes.io/part-of: dienst }
resources:
  - namespace.yaml
  - configmap.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml
  - policies.yaml
  - migrate-job.yaml
  - backup.yaml
images:
  - name: ghcr.io/ssapkota1/dienst-api
    newTag: latest
  - name: ghcr.io/ssapkota1/dienst-web
    newTag: latest
  - name: ghcr.io/ssapkota1/dienst-ops
    newTag: latest
