apiVersion: apps/v1
kind: Deployment
metadata:
  name: dienst-web
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: dienst-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dienst-web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/ssapkota1/dienst-web
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: dienst-web
spec:
  selector: { app.kubernetes.io/name: dienst-web }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dienst-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: dienst-web }
