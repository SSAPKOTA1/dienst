# nginx for the web app container: static files with security headers, /api proxied to the API container.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # the API trusts the nearest proxy (TRUST_PROXY=1): pass on what this proxy saw, appended to what came in
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-Id $request_id;
    client_max_body_size 11m;
    proxy_read_timeout 60s;
  }
  # liveness of this container for the load balancer (not proxied to the API)
  location = /healthz { access_log off; include /etc/nginx/snippets/security-headers.conf; add_header Content-Type text/plain always; return 200 "ok"; }

  location = /sw.js      { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /index.html { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; }
  location /assets/      { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location /             { try_files $uri /index.html; }
}
