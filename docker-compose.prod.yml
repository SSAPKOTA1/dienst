# Production-like stack: Postgres, a one-shot migration job, the API, and the web container (nginx).
# Put a TLS-terminating balancer (or your platform's ingress) in front of `web` (port 8080).
#   cp .env.production.example .env.production   # fill in the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dienst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: dienst
    volumes: ['dbdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dienst -d dienst']
      interval: 5s
      retries: 20
    networks: [internal]

  migrate:
    build: { context: ., target: api }
    command: ['node', 'apps/api/dist/migrate.mjs']
    environment:
      DATABASE_URL: postgres://dienst:${POSTGRES_PASSWORD}@db:5432/dienst
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'
    networks: [internal]

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://dienst:${POSTGRES_PASSWORD}@db:5432/dienst
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATA_KEY: ${DATA_KEY:?set DATA_KEY}
      COOKIE_SECURE: 'true'
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      TRUST_PROXY: '1'
      RUN_JOBS: 'false'
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-Dienstplan <noreply@dienst.local>}
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [internal]

  worker:
    build: { context: ., target: api }
    command: ['node', 'apps/api/dist/worker.mjs']
    healthcheck: { disable: true }
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://dienst:${POSTGRES_PASSWORD}@db:5432/dienst
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATA_KEY: ${DATA_KEY:?set DATA_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-Dienstplan <noreply@dienst.local>}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ['${WEB_PORT:-8080}:8080']
    networks: [internal]

volumes:
  dbdata:
networks:
  internal:
