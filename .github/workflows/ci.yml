name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dienst, POSTGRES_PASSWORD: dienst, POSTGRES_DB: dienst_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dienst" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dienst:dienst@localhost:5432/dienst_test
      DATABASE_URL: postgres://dienst:dienst@localhost:5432/dienst_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
