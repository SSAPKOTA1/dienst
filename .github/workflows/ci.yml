name: ci
on:
  push:
    branches: [main]
  pull_request:

# least privilege: the workflows only read the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://dienst:dienst@localhost:5432/dienst_test
  TEST_DATABASE_URL: postgres://dienst:dienst@localhost:5432/dienst_test

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dienst, POSTGRES_PASSWORD: dienst, POSTGRES_DB: dienst_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dienst" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # known vulnerabilities: production packages must be clean, development tooling too (one reviewed exception
      # is listed in package.json under pnpm.auditConfig with its reason in docs/DECISIONS.md)
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: node scripts/docs/check-links.mjs
      - name: API reference is up to date (pnpm docs:api)
        env: { DATABASE_URL: 'postgres://dienst:dienst@localhost:5432/dienst_test' }
        run: |
          pnpm docs:api >/dev/null
          git diff --exit-code docs/api || { echo "::error::run pnpm docs:api and commit docs/api"; exit 1; }

  e2e:
    name: end-to-end (Playwright, accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dienst, POSTGRES_PASSWORD: dienst, POSTGRES_DB: dienst_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dienst" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/test-results
            playwright-report
          retention-days: 7

  e2e-browsers:
    name: end-to-end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dienst, POSTGRES_PASSWORD: dienst, POSTGRES_DB: dienst_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dienst" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: BROWSERS=all pnpm e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: e2e/test-results

  containers:
    name: images, smoke tests, backups, SBOM, scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dienst, POSTGRES_PASSWORD: dienst, POSTGRES_DB: dienst_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dienst" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client age
      # the full Dockerfile, including the dependency stage that cannot run in every sandbox
      - run: docker build --target api -t dienst-api:ci .
      - run: docker build --target web -t dienst-web:ci .
      - run: docker build --target ops -t dienst-ops:ci .
      - name: The ops image has what the cron jobs need
        run: docker run --rm --entrypoint sh dienst-ops:ci -c 'pg_dump --version && age --version && node --version && test -f /app/apps/api/dist/drill.mjs'
      - run: scripts/ops/smoke-container.sh dienst-api:ci postgres://dienst:dienst@localhost:5432/postgres
      - run: scripts/ops/smoke-web.sh dienst-web:ci
      # backup, restore, drill and tamper detection against a migrated and seeded database
      - run: pnpm db:migrate && pnpm db:seed
      - run: node scripts/build-api.mjs && scripts/ops/test-backup.sh
      - name: Software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: dienst-api:ci
          format: cyclonedx-json
          artifact-name: sbom-api.cdx.json
      - name: Scan the API image for known vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dienst-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: library

  infra:
    name: infrastructure code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: scripts/ci/install-infra-tools.sh /usr/local/bin
      - name: Kubernetes manifests (both overlays) against the schemas
        run: |
          for o in staging production; do
            kustomize build deploy/k8s/overlays/$o | kubeconform -strict -summary -
          done
      - name: Prometheus rules and their unit tests
        run: |
          promtool check rules deploy/alerts.yml
          promtool test rules deploy/tests/alerts.test.yml
          promtool check config --syntax-only deploy/monitoring/prometheus.yml
      - name: Dashboard is valid JSON
        run: jq -e '.panels | length > 0' deploy/grafana/dienst-dashboard.json
      - name: Compose files render
        run: |
          export POSTGRES_PASSWORD=x JWT_SECRET=x DATA_KEY=x WEB_ORIGIN=https://x DIENST_DOMAIN=x GRAFANA_ADMIN_PASSWORD=x
          docker compose -f docker-compose.prod.yml -f deploy/vm/docker-compose.vm.yml config -q
          docker compose -f docker-compose.prod.yml -f deploy/monitoring/docker-compose.monitoring.yml config -q
      - name: Shell scripts and workflows
        run: |
          shellcheck scripts/ops/*.sh scripts/ci/*.sh deploy/vm/bootstrap.sh
          actionlint
