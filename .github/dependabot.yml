version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      # one pull request for the routine updates, security updates stay separate
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
