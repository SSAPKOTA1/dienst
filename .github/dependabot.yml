version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      # one pull request for the routine updates, security updates stay separate
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      # the ops image carries pg_dump/pg_restore and must match the database server (16); a major upgrade is a planned migration
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
