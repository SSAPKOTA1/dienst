services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dienst
      POSTGRES_PASSWORD: dienst
      POSTGRES_DB: dienst
    ports: ['5432:5432']
    volumes: ['dbdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dienst']
      interval: 5s
      retries: 10
  mailhog:
    image: mailhog/mailhog
    ports: ['1025:1025', '8025:8025']
volumes:
  dbdata:
